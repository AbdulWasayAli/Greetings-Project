name: Deploy to MonsterASP.NET

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - 'docs/**'
      - '.gitignore'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: http://greetings.runasp.net

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore E-Project/E-Project.csproj

      - name: Build and Publish
        run: dotnet publish E-Project/E-Project.csproj -c Release -o ./publish

      - name: Sync / Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          dangerous-clean-slate: false
          local-dir: ./publish/
          server-dir: /wwwroot/
          exclude: |
            **/app.db
            **/app.db-journal
            **/uploads/**
            **/site.zip
